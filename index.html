<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CQR - Sistema de Asistencia</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      background: #eceff1;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
    }

    .card {
      width: 420px;
      margin: 40px auto;
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

    .titulo {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
    }

    .subtitulo {
      text-align: center;
      font-size: 20px;
      margin-top: 5px;
    }

    .sistema {
      text-align: center;
      margin-top: 10px;
      color: #555;
    }

    hr {
      margin-top: 15px;
    }

    .dato {
      margin-top: 25px;
    }

    label {
      font-weight: bold;
    }

    #evento {
      font-size: 24px;
      margin-top: 5px;
    }

    #fecha {
      font-size: 20px;
      color: #666;
    }

    .contador {
      text-align: center;
      font-size: 80px;
      color: #1565C0;
      font-weight: bold;
      margin-top: 40px;
    }

    .textoContador {
      text-align: center;
      font-size: 20px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      font-size: 20px;
      cursor: pointer;
    }

    #btnCaptura {
      background: #1565C0;
      color: white;
      border: none;
    }

    #btnProcesar {
      background: #2E7D32;
      color: white;
      border: none;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 17px;
    }

  </style>

</head>


<body>

<div class="card">

  <div class="titulo">
    ARQUIDIÓCESIS DE TIJUANA
  </div>

  <div class="subtitulo">
    Cancillería
  </div>

  <div class="sistema">
    Sistema de Control de Asistencia QR
  </div>

  <hr>


  <div class="dato">

    <label>Evento</label>

    <div id="evento">
      Cargando...
    </div>

  </div>


  <div class="dato">

    <label>Fecha</label>

    <div id="fecha">
      --
    </div>

  </div>


  <div class="contador">

    <span id="contador">
      0
    </span>

  </div>


  <div class="textoContador">
    Escaneados
  </div>


  <div id="reader"></div>


  <button id="btnCaptura">
    Iniciar Captura
  </button>


  <button id="btnProcesar">
    Procesar
  </button>


  <div id="resultado">
    Esperando QR...
  </div>

</div>


<script>

// ========================================
// CONFIGURACIÓN
// ========================================

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbzZ-GOf-VKFCyxplAvN8h9NsW16Qqrrd7YoDqb20r8xDXUYeZCXaNbEfsn9ieY3yYmtRw/exec";


let scanner = null;

let escaneados = [];

let procesando = false;


// ========================================
// ELEMENTOS
// ========================================

const btnCaptura =
  document.getElementById("btnCaptura");

const btnProcesar =
  document.getElementById("btnProcesar");

const contador =
  document.getElementById("contador");

const resultado =
  document.getElementById("resultado");



// ========================================
// INICIAR CÁMARA
// ========================================

btnCaptura.addEventListener(
  "click",
  iniciarCamara
);


function iniciarCamara() {

  if (scanner) {

    return;

  }


  scanner =
    new Html5Qrcode("reader");


  Html5Qrcode
    .getCameras()


    .then(function(cameras) {

      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "No se encontró ninguna cámara."
        );

      }


      return scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 15,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        function(decodedText) {

          leerQR(decodedText);

        },

        function(errorMessage) {

          // Errores normales de lectura.
          // No mostramos nada.

        }

      );

    })


    .then(function() {

      btnCaptura.disabled = true;

    })


    .catch(function(error) {

      console.error(
        "Error cámara:",
        error
      );


      alert(
        "No se pudo iniciar la cámara:\n" +
        error
      );


      scanner = null;

    });

}



// ========================================
// LEER QR
// ========================================

function leerQR(decodedText) {

  if (procesando) {

    return;

  }


  console.log(
    "QR leído:",
    decodedText
  );


  let codigoQR =
    decodedText;


  // ======================================
  // EXTRAER PARÁMETRO qr DE LA URL
  // ======================================

  try {

    const url =
      new URL(decodedText);


    const qr =
      url.searchParams.get("qr");


    if (qr) {

      codigoQR = qr;

    }

  }

  catch (error) {

    // Si no es URL, usamos directamente
    // el texto leído.

  }


  codigoQR =
    codigoQR.trim();


  console.log(
    "Código QR:",
    codigoQR
  );


  if (!codigoQR) {

    return;

  }


  // ======================================
  // EVITAR DUPLICADOS EN LA CAPTURA
  // ======================================

  if (
    escaneados.includes(codigoQR)
  ) {

    console.log(
      "QR ya capturado:",
      codigoQR
    );

    return;

  }


  escaneados.push(
    codigoQR
  );


  contador.textContent =
    escaneados.length;


  resultado.innerHTML =
    "✅ QR capturado:<br>" +
    codigoQR;


  console.log(
    "Total capturados:",
    escaneados.length
  );

}



// ========================================
// PROCESAR
// ========================================

btnProcesar.addEventListener(
  "click",
  procesarQR
);


function procesarQR() {

  if (procesando) {

    return;

  }


  if (
    escaneados.length === 0
  ) {

    resultado.innerHTML =
      "⚠️ No hay códigos para procesar.";

    return;

  }


  procesando = true;


  btnCaptura.disabled = true;

  btnProcesar.disabled = true;


  let indice = 0;

  let registrados = 0;

  let duplicados = 0;

  let noRegistrados = 0;

  let errores = 0;


  const total =
    escaneados.length;



  // ======================================
  // FUNCIÓN PARA PROCESAR SIGUIENTE
  // ======================================

  function siguiente() {

    if (
      indice >= total
    ) {

      finalizar();

      return;

    }


    const codigoQR =
      escaneados[indice];


    const numero =
      indice + 1;


    resultado.innerHTML =

      "⏳ <strong>Procesando...</strong><br>" +

      numero +
      " de " +
      total +

      "<br>" +

      codigoQR;


    console.log(
      "Procesando QR:",
      codigoQR
    );



    // ====================================
    // FUNCIÓN DE RESPUESTA JSONP
    // ====================================

    const nombreCallback =
      "respuestaAsistencia_" +
      Date.now() +
      "_" +
      indice;


    window[nombreCallback] =
      function(respuesta) {

        console.log(
          "RESPUESTA DIRECTA:",
          respuesta
        );


        // ==================================
        // REGISTRADO
        // ==================================

        if (
          respuesta &&
          respuesta.ok === true
        ) {

          registrados++;

        }


        // ==================================
        // DUPLICADO
        // ==================================

        else if (
          respuesta &&
          respuesta.duplicado === true
        ) {

          duplicados++;

        }


        // ==================================
        // NO REGISTRADO
        // ==================================

        else if (
          respuesta &&
          respuesta.noRegistrado === true
        ) {

          noRegistrados++;

        }


        // ==================================
        // ERROR
        // ==================================

        else {

          errores++;

        }


        // ==================================
        // LIMPIAR SCRIPT
        // ==================================

        if (scriptJSONP.parentNode) {

          scriptJSONP.parentNode
            .removeChild(scriptJSONP);

        }


        delete window[nombreCallback];


        indice++;


        setTimeout(
          siguiente,
          100
        );

      };



    // ====================================
    // CREAR SCRIPT JSONP
    // ====================================

    const scriptJSONP =
      document.createElement("script");


    scriptJSONP.src =

      URL_APPS_SCRIPT +

      "?action=registrarAsistencia" +

      "&qr=" +
      encodeURIComponent(codigoQR) +

      "&dispositivo=" +
      encodeURIComponent(
        "CQR Scanner"
      ) +

      "&callback=" +
      nombreCallback +

      "&t=" +
      Date.now();



    scriptJSONP.onerror =
      function(error) {

        console.error(
          "❌ Error JSONP:",
          codigoQR,
          error
        );


        errores++;


        if (
          scriptJSONP.parentNode
        ) {

          scriptJSONP.parentNode
            .removeChild(scriptJSONP);

        }


        delete window[nombreCallback];


        indice++;


        setTimeout(
          siguiente,
          100
        );

      };


    console.log(
      "URL JSONP:",
      scriptJSONP.src
    );


    document.body.appendChild(
      scriptJSONP
    );

  }



  // ======================================
  // FINALIZAR
  // ======================================

  function finalizar() {

    procesando = false;

    escaneados = [];
    contador.textContent = "0";
    resultado.innerHTML =

      "✅ <strong>Procesamiento terminado</strong><br><br>" +

      "Total escaneados: " +
      total +

      "<br>" +

      "🟢 Registrados: " +
      registrados +

      "<br>" +

      "🟡 Duplicados: " +
      duplicados +

      "<br>" +

      "🔴 No registrados: " +
      noRegistrados +

      "<br>" +

      "❌ Errores: " +
      errores;


    btnCaptura.disabled = false;

    btnProcesar.disabled = false;


    console.log(
      "PROCESAMIENTO TERMINADO"
    );


    console.log(
      "Total:",
      total
    );


    console.log(
      "Registrados:",
      registrados
    );


    console.log(
      "Duplicados:",
      duplicados
    );


    console.log(
      "No registrados:",
      noRegistrados
    );


    console.log(
      "Errores:",
      errores
    );

  }


  siguiente();

}

</script>

</body>

</html>
