<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CQR - Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    .contador {
      font-size: 42px;
      font-weight: bold;
      color: #1769c2;
      margin-top: 20px;
    }

    .resultado {
      margin-top: 15px;
      padding: 12px;
      background: #e8f5e9;
      border-radius: 8px;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    #btnIniciar {
      background: #1769c2;
      color: white;
    }

    #btnDetener {
      background: #b71c1c;
      color: white;
    }

    #btnDetener:disabled {
      background: #ccc;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>CQR</h1>

    <div class="subtitulo">
      Sistema de Control de Asistencia QR
    </div>

    <button id="btnIniciar">
      Iniciar Cámara
    </button>

    <button id="btnDetener" disabled>
      Detener Cámara
    </button>

    <div id="reader"></div>

    <div class="contador" id="contador">
      0
    </div>

    <div>
      Escaneados
    </div>

    <div class="resultado" id="resultado">
      Esperando QR...
    </div>

  </div>


<script>

let scanner = null;
let escaneados = [];

document.getElementById("btnIniciar").addEventListener("click", iniciarCamara);

document.getElementById("btnDetener").addEventListener("click", detenerCamara);


function iniciarCamara() {

  if (scanner) {
    return;
  }

  scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras()

    .then(function(cameras) {

      if (!cameras || cameras.length === 0) {
        throw new Error("No se encontró ninguna cámara.");
      }

      const cameraId = cameras[0].id;

      scanner.start(

        cameraId,

        {
          fps: 15,
          qrbox: function(viewfinderWidth, viewfinderHeight) {

            const minEdgeSize =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );

            const qrboxSize =
              Math.floor(
                minEdgeSize * 0.70
              );

            return {
              width: qrboxSize,
              height: qrboxSize
            };
          }
        },

        function(decodedText) {

          if (scanner === null) {
            return;
          }

          console.log(
            "QR leído:",
            decodedText
          );

          let codigoQR = decodedText;

          try {

            const url =
              new URL(decodedText);

            const qrParametro =
              url.searchParams.get("qr");

            if (qrParametro) {
              codigoQR = qrParametro;
            }

          } catch (error) {

            codigoQR = decodedText;

          }

          const scannerActual = scanner;

          scanner = null;

          scannerActual.stop()

            .then(function() {

              scannerActual.clear();

              document.getElementById(
                "btnIniciar"
              ).disabled = false;

              document.getElementById(
                "btnDetener"
              ).disabled = true;

              document.getElementById(
                "resultado"
              ).textContent =
                "⏳ Consultando asistencia...";

              enviarAsistencia(codigoQR);

            })

            .catch(function(error) {

              console.log(
                "Error al detener cámara:",
                error
              );

              document.getElementById(
                "resultado"
              ).textContent =
                "⏳ Consultando asistencia...";

              enviarAsistencia(codigoQR);

            });

        },

        function(errorMessage) {

          // Errores normales mientras busca el QR.
          // No mostramos mensajes.

        }

      )

      .then(function() {

        document.getElementById(
          "btnIniciar"
        ).disabled = true;

        document.getElementById(
          "btnDetener"
        ).disabled = false;

      })

      .catch(function(error) {

        alert(
          "No se pudo iniciar la cámara: " +
          error
        );

        scanner = null;

      });

    })

    .catch(function(error) {

      alert(
        "No se pudo acceder a la cámara: " +
        error
      );

      scanner = null;

    });

}
  
  function detenerCamara() {

  if (!scanner) {
    return;
  }

  scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

      document.getElementById("btnIniciar").disabled = false;
      document.getElementById("btnDetener").disabled = true;

    })

    .catch(function(error) {

      console.log("Error al detener cámara:", error);

    });

}

function enviarAsistencia(codigoQR) {

  console.log("Enviando QR al puente:", codigoQR);

  document.getElementById("resultado").textContent =
    "⏳ Registrando asistencia...";

  const puente =
    document.getElementById("puenteCQR");

  if (!puente) {

    document.getElementById("resultado").textContent =
      "❌ No se encontró el puente CQR.";

    return;
  }

 puente.contentWindow.postMessage(
  {
    tipo: "CQR_REGISTRAR",
    codigoQR: codigoQR
  },
  "*"
);
  
}

window.addEventListener("message", function(event) {

  if (
    event.origin !== "https://script.google.com" &&
    event.origin !== "https://script.googleusercontent.com"
  ) {
    return;
  }

  const datos = event.data;

  console.log("Respuesta del puente:", datos);

  if (!datos) {
    return;
  }


  // ==============================
  // RESPUESTA CORRECTA
  // ==============================

  if (datos.tipo === "CQR_RESULTADO") {

    const resultado = datos.resultado;

    if (resultado.ok) {

      document.getElementById("resultado").innerHTML =
        "✅ <strong>Asistencia registrada</strong><br>" +
        resultado.nombre + " " +
        resultado.apellido + "<br>" +
        "Decanato: " +
        resultado.decanato;

    }

    else if (resultado.duplicado) {

      document.getElementById("resultado").innerHTML =
        "⚠️ <strong>Asistencia ya registrada</strong><br>" +
        resultado.nombre + " " +
        resultado.apellido + "<br>" +
        "Decanato: " +
        resultado.decanato;

    }

    else {

      document.getElementById("resultado").innerHTML =
        "❌ <strong>Error</strong><br>" +
        (
          resultado.error ||
          resultado.mensaje ||
          "No se pudo registrar."
        );

    }

    return;
  }


  // ==============================
  // ERROR DEL PUENTE
  // ==============================

  if (datos.tipo === "CQR_ERROR") {

    document.getElementById("resultado").innerHTML =
      "❌ <strong>Error</strong><br>" +
      datos.mensaje;

  }

});


</script>
<iframe
  id="puenteCQR"
  src="https://script.google.com/macros/s/AKfycbxcC2QbldGfViMwHnYc44oeJ2_rR6gdjMIqp8lhDp4u6FPi1hHsEQshq8mJ2hRu7O_Ucw/exec?puente=1"
  style="display:none;"
></iframe>
</body>
</html>
