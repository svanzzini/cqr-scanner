<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CQR - Lector QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    .contador {
      font-size: 42px;
      font-weight: bold;
      color: #1769c2;
      margin-top: 20px;
    }

    .resultado {
      margin-top: 15px;
      padding: 12px;
      background: #e8f5e9;
      border-radius: 8px;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    #btnIniciar {
      background: #1769c2;
      color: white;
    }

    #btnDetener {
      background: #b71c1c;
      color: white;
    }

    #btnDetener:disabled {
      background: #ccc;
    }

    #btnProcesar {
      background: #2e7d32;
      color: white;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <h1>CQR</h1>

    <div class="subtitulo">
      Sistema de Control de Asistencia QR
    </div>


    <button id="btnIniciar">
      Iniciar Cámara
    </button>


    <button
      id="btnDetener"
      disabled
    >
      Detener Cámara
    </button>


    <button id="btnProcesar">
      Procesar
    </button>


    <div id="reader"></div>


    <div
      class="contador"
      id="contador"
    >
      0
    </div>


    <div>
      Escaneados
    </div>


    <div
      class="resultado"
      id="resultado"
    >
      Esperando QR...
    </div>

  </div>


<script>

let scanner = null;

let escaneados = [];

let procesando = false;


// ========================================
// BOTONES
// ========================================

document
  .getElementById("btnIniciar")
  .addEventListener(
    "click",
    iniciarCamara
  );


document
  .getElementById("btnDetener")
  .addEventListener(
    "click",
    detenerCamara
  );


document
  .getElementById("btnProcesar")
  .addEventListener(
    "click",
    procesarQR
  );



// ========================================
// INICIAR CÁMARA
// ========================================

function iniciarCamara() {

  if (
    scanner ||
    procesando
  ) {

    return;

  }


  scanner =
    new Html5Qrcode("reader");


  Html5Qrcode
    .getCameras()


    .then(
      function(cameras) {

        if (
          !cameras ||
          cameras.length === 0
        ) {

          throw new Error(
            "No se encontró ninguna cámara."
          );

        }


        scanner.start(

          {
            facingMode: "environment"
          },


          {
            fps: 15,

            qrbox:
              function(
                viewfinderWidth,
                viewfinderHeight
              ) {

                const minEdgeSize =
                  Math.min(
                    viewfinderWidth,
                    viewfinderHeight
                  );


                const qrboxSize =
                  Math.floor(
                    minEdgeSize * 0.70
                  );


                return {

                  width: qrboxSize,

                  height: qrboxSize

                };

              }

          },


          // ==================================
          // QR LEÍDO
          // ==================================

          function(decodedText) {

            if (
              !scanner ||
              procesando
            ) {

              return;

            }


            console.log(
              "QR leído:",
              decodedText
            );


            // ================================
            // OBTENER CÓDIGO QR
            // ================================

            let codigoQR =
              decodedText;


            try {

              const url =
                new URL(decodedText);


              const qrParametro =
                url.searchParams.get("qr");


              if (qrParametro) {

                codigoQR =
                  qrParametro;

              }

            }

            catch (error) {

              codigoQR =
                decodedText;

            }


            codigoQR =
              codigoQR.trim();


            if (!codigoQR) {

              return;

            }


            console.log(
              "Código QR:",
              codigoQR
            );


            // ================================
            // EVITAR DUPLICADO EN CAPTURA
            // ================================

            if (
              escaneados.includes(codigoQR)
            ) {

              document
                .getElementById("resultado")
                .innerHTML =

                "⚠️ <strong>QR ya capturado</strong><br>" +
                codigoQR;

              return;

            }


            // ================================
            // GUARDAR QR
            // ================================

            escaneados.push(
              codigoQR
            );


            // ================================
            // CONTADOR
            // ================================

            document
              .getElementById("contador")
              .textContent =
              escaneados.length;


            // ================================
            // MENSAJE
            // ================================

            document
              .getElementById("resultado")
              .innerHTML =

              "✅ <strong>QR capturado</strong><br>" +
              codigoQR;


            console.log(
              "Total capturados:",
              escaneados.length
            );

          },


          // ================================
          // ERRORES NORMALES DE LECTURA
          // ================================

          function(errorMessage) {

            // No mostrar nada.

          }

        );

      }

    )


    .then(
      function() {

        document
          .getElementById("btnIniciar")
          .disabled = true;


        document
          .getElementById("btnDetener")
          .disabled = false;

      }

    )


    .catch(
      function(error) {

        console.error(
          "Error cámara:",
          error
        );


        alert(
          "No se pudo iniciar la cámara:\n" +
          error
        );


        scanner = null;


        document
          .getElementById("btnIniciar")
          .disabled = false;

      }

    );

}



// ========================================
// DETENER CÁMARA
// ========================================

function detenerCamara() {

  if (!scanner) {

    return;

  }


  const scannerActual =
    scanner;


  scanner = null;


  scannerActual
    .stop()


    .then(
      function() {

        scannerActual.clear();


        document
          .getElementById("btnIniciar")
          .disabled = false;


        document
          .getElementById("btnDetener")
          .disabled = true;

      }

    )


    .catch(
      function(error) {

        console.error(
          "Error al detener cámara:",
          error
        );


        document
          .getElementById("btnIniciar")
          .disabled = false;


        document
          .getElementById("btnDetener")
          .disabled = true;

      }

    );

}



// ========================================
// PUENTE APPS SCRIPT
// ========================================

const URL_PUENTE =
  "https://script.google.com/macros/s/AKfycbzZ-GOf-VKFCyxplAvN8h9NsW16Qqrrd7YoDqb20r8xDXUYeZCXaNbEfsn9ieY3yYmtRw/exec?puente=1";


let iframePuente = null;

let puenteListo = false;

let respuestaPuente = null;



// ========================================
// CREAR PUENTE
// ========================================

function iniciarPuente() {

  if (iframePuente) {

    return;

  }


  iframePuente =
    document.createElement("iframe");


  iframePuente.style.display =
    "none";


  iframePuente.src =
    URL_PUENTE;


  document.body.appendChild(
    iframePuente
  );


  console.log(
    "PUENTE CQR INICIANDO..."
  );

}



// ========================================
// ESCUCHAR RESPUESTAS DEL PUENTE
// ========================================

window.addEventListener(
  "message",
  function(event) {

    console.log(
      "MENSAJE RECIBIDO DEL PUENTE:",
      event.data
    );


    if (
      !event.data ||
      !event.data.tipo
    ) {

      return;

    }


    // ======================================
    // PUENTE LISTO
    // ======================================

    if (
      event.data.tipo ===
      "CQR_PUENTE_LISTO"
    ) {

      puenteListo = true;


      console.log(
        "✅ PUENTE CQR LISTO"
      );


      return;

    }


    // ======================================
    // RESULTADO
    // ======================================

    if (
      event.data.tipo ===
      "CQR_RESULTADO"
    ) {

      if (
        typeof respuestaPuente ===
        "function"
      ) {

        respuestaPuente(
          event.data.resultado
        );

      }


      return;

    }


    // ======================================
    // ERROR
    // ======================================

    if (
      event.data.tipo ===
      "CQR_ERROR"
    ) {

      if (
        typeof respuestaPuente ===
        "function"
      ) {

        respuestaPuente({

          ok: false,

          duplicado: false,

          noRegistrado: false,

          error:
            event.data.mensaje ||
            "Error en Apps Script"

        });

      }

    }

  }

);



// ========================================
// INICIAR PUENTE
// ========================================

iniciarPuente();



// ========================================
// PROCESAR TODOS LOS QR
// ========================================

function procesarQR() {

  if (procesando) {

    return;

  }


  if (
    escaneados.length === 0
  ) {

    document
      .getElementById("resultado")
      .innerHTML =
      "⚠️ No hay códigos para procesar.";

    return;

  }


  procesando = true;


  detenerCamara();


  const total =
    escaneados.length;


  let indice = 0;

  let registrados = 0;

  let duplicados = 0;

  let noRegistrados = 0;

  let errores = 0;


  document
    .getElementById("resultado")
    .innerHTML =

    "⏳ <strong>Procesando...</strong><br>" +
    "0 de " +
    total;


  document
    .getElementById("btnIniciar")
    .disabled = true;


  document
    .getElementById("btnDetener")
    .disabled = true;


  document
    .getElementById("btnProcesar")
    .disabled = true;



  // ========================================
  // ESPERAR RESPUESTA DEL PUENTE
  // ========================================

  respuestaPuente =
    function(resultado) {

      console.log(
        "Respuesta Apps Script:",
        resultado
      );


      // ====================================
      // REGISTRADO
      // ====================================

      if (
        resultado &&
        resultado.ok === true
      ) {

        registrados++;

      }


      // ====================================
      // DUPLICADO
      // ====================================

      else if (
        resultado &&
        resultado.duplicado === true
      ) {

        duplicados++;

      }


      // ====================================
      // NO REGISTRADO
      // ====================================

      else if (
        resultado &&
        resultado.noRegistrado === true
      ) {

        noRegistrados++;

      }


      // ====================================
      // ERROR
      // ====================================

      else {

        errores++;

      }


      indice++;


      siguiente();

    };



  // ========================================
  // SIGUIENTE QR
  // ========================================

  function siguiente() {

    if (
      indice >= total
    ) {

      finalizar();

      return;

    }


    const codigoQR =
      escaneados[indice];


    const numero =
      indice + 1;


    document
      .getElementById("resultado")
      .innerHTML =

      "⏳ <strong>Procesando...</strong><br>" +

      numero +
      " de " +
      total +

      "<br>" +

      codigoQR;


    console.log(
      "Procesando QR:",
      codigoQR
    );


    // ======================================
    // VERIFICAR PUENTE
    // ======================================

    if (
      !iframePuente ||
      !puenteListo
    ) {

      console.error(
        "❌ Puente no está listo"
      );


      errores++;

      indice++;


      setTimeout(
        siguiente,
        500
      );


      return;

    }


    // ======================================
    // ENVIAR QR AL PUENTE
    // ======================================

    console.log(
      "Enviando QR al puente:",
      codigoQR
    );


    iframePuente
      .contentWindow
      .postMessage(

        {
          tipo:
            "CQR_REGISTRAR",

          codigoQR:
            codigoQR
        },

        "*"

      );

  }



  // ========================================
  // FINALIZAR
  // ========================================

  function finalizar() {

    procesando = false;


    respuestaPuente = null;


    document
      .getElementById("resultado")
      .innerHTML =

      "✅ <strong>Procesamiento terminado</strong><br><br>" +

      "Total escaneados: " +
      total +

      "<br>" +

      "🟢 Registrados: " +
      registrados +

      "<br>" +

      "🟡 Duplicados: " +
      duplicados +

      "<br>" +

      "🔴 No registrados: " +
      noRegistrados +

      "<br>" +

      "❌ Errores: " +
      errores;


    document
      .getElementById("btnIniciar")
      .disabled = false;


    document
      .getElementById("btnDetener")
      .disabled = true;


    document
      .getElementById("btnProcesar")
      .disabled = false;


    console.log(
      "PROCESAMIENTO TERMINADO"
    );


    console.log(
      "Total:",
      total
    );


    console.log(
      "Registrados:",
      registrados
    );


    console.log(
      "Duplicados:",
      duplicados
    );


    console.log(
      "No registrados:",
      noRegistrados
    );


    console.log(
      "Errores:",
      errores
    );

  }


  // ========================================
  // INICIAR PROCESAMIENTO
  // ========================================

  siguiente();

}

</script>

</body>

</html>
