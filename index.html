<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CQR - Lector QR</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitulo {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    .contador {
      font-size: 42px;
      font-weight: bold;
      color: #1769c2;
      margin-top: 20px;
    }

    .resultado {
      margin-top: 15px;
      padding: 12px;
      background: #e8f5e9;
      border-radius: 8px;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    #btnIniciar {
      background: #1769c2;
      color: white;
    }

    #btnDetener {
      background: #b71c1c;
      color: white;
    }

    #btnDetener:disabled {
      background: #ccc;
    }
    #btnProcesar {
  background: #2e7d32;
  color: white;
}
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>CQR</h1>

    <div class="subtitulo">
      Sistema de Control de Asistencia QR
    </div>

    <button id="btnIniciar">
      Iniciar Cámara
    </button>

    <button id="btnDetener" disabled>
      Detener Cámara
    </button>
<button
  id="btnProcesar"
  onclick="procesarQR()"
>
  Procesar
</button>

    <div id="reader"></div>

    <div class="contador" id="contador">
      0
    </div>

    <div>
      Escaneados
    </div>

    <div class="resultado" id="resultado">
      Esperando QR...
    </div>

  </div>


<script>
<script>

let scanner = null;
let escaneados = [];
let procesando = false;


// ========================================
// BOTONES
// ========================================

document.getElementById("btnIniciar")
  .addEventListener("click", iniciarCamara);

document.getElementById("btnDetener")
  .addEventListener("click", detenerCamara);


// ========================================
// INICIAR CÁMARA
// ========================================

function iniciarCamara() {

  if (scanner || procesando) {
    return;
  }

  scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras()

    .then(function(cameras) {

      if (!cameras || cameras.length === 0) {
        throw new Error(
          "No se encontró ninguna cámara."
        );
      }

      const cameraId = cameras[0].id;

      return scanner.start(

        cameraId,

        {
          fps: 15,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const minEdgeSize =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );

            const qrboxSize =
              Math.floor(
                minEdgeSize * 0.70
              );

            return {
              width: qrboxSize,
              height: qrboxSize
            };
          }
        },


        // ==================================
        // QR LEÍDO
        // ==================================

        function(decodedText) {

          if (!scanner) {
            return;
          }


          console.log(
            "QR leído:",
            decodedText
          );


          // =================================
          // OBTENER CÓDIGO
          // =================================

          let codigoQR =
            decodedText;


          try {

            const url =
              new URL(decodedText);

            const qrParametro =
              url.searchParams.get("qr");


            if (qrParametro) {

              codigoQR =
                qrParametro;

            }

          }

          catch (error) {

            codigoQR =
              decodedText;

          }


          codigoQR =
            codigoQR.trim();


          console.log(
            "Código QR:",
            codigoQR
          );


          // =================================
          // EVITAR DUPLICADOS EN CAPTURA
          // =================================

          if (
            escaneados.includes(codigoQR)
          ) {

            document.getElementById(
              "resultado"
            ).innerHTML =
              "⚠️ <strong>QR ya capturado</strong><br>" +
              codigoQR;

            return;

          }


          // =================================
          // GUARDAR QR
          // =================================

          escaneados.push(
            codigoQR
          );


          // =================================
          // CONTADOR
          // =================================

          document.getElementById(
            "contador"
          ).textContent =
            escaneados.length;


          // =================================
          // MENSAJE
          // =================================

          document.getElementById(
            "resultado"
          ).innerHTML =
            "✅ <strong>QR capturado</strong><br>" +
            codigoQR;


          console.log(
            "QR almacenados:",
            escaneados
          );

        },


        // ==================================
        // ERRORES NORMALES
        // ==================================

        function(errorMessage) {

          // Ignorar errores normales
          // de búsqueda del QR.

        }

      );

    })

    .then(function() {

      document.getElementById(
        "btnIniciar"
      ).disabled = true;

      document.getElementById(
        "btnDetener"
      ).disabled = false;

    })

    .catch(function(error) {

      console.error(
        "Error cámara:",
        error
      );

      alert(
        "No se pudo iniciar la cámara: " +
        error
      );

      scanner = null;

    });

}


// ========================================
// DETENER CÁMARA
// ========================================

function detenerCamara() {

  if (!scanner) {
    return;
  }


  const scannerActual =
    scanner;


  scanner = null;


  scannerActual.stop()

    .then(function() {

      scannerActual.clear();


      document.getElementById(
        "btnIniciar"
      ).disabled = false;


      document.getElementById(
        "btnDetener"
      ).disabled = true;

    })

    .catch(function(error) {

      console.error(
        "Error al detener cámara:",
        error
      );

    });

}


// ========================================
// PROCESAR QR
// ========================================

function procesarQR() {

  if (procesando) {
    return;
  }


  if (escaneados.length === 0) {

    document.getElementById(
      "resultado"
    ).innerHTML =
      "⚠️ No hay códigos para procesar.";

    return;

  }


  procesando = true;


  detenerCamara();


  const total =
    escaneados.length;


  let indice = 0;
  let registrados = 0;
  let duplicados = 0;
  let errores = 0;


  document.getElementById(
    "resultado"
  ).innerHTML =
    "⏳ <strong>Procesando...</strong><br>" +
    "0 de " +
    total;


  document.getElementById(
    "btnIniciar"
  ).disabled = true;


  document.getElementById(
    "btnDetener"
  ).disabled = true;


  function siguiente() {

    if (indice >= total) {

      finalizar();

      return;

    }


    const codigo =
      escaneados[indice];


    const numero =
      indice + 1;


    document.getElementById(
      "resultado"
    ).innerHTML =
      "⏳ <strong>Procesando...</strong><br>" +
      numero +
      " de " +
      total;


    google.script.run

      .withSuccessHandler(
        function(resultado) {

          console.log(
            "Resultado:",
            codigo,
            resultado
          );


          if (
            resultado &&
            resultado.ok
          ) {

            registrados++;

          }

          else if (
            resultado &&
            resultado.duplicado
          ) {

            duplicados++;

          }

          else {

            errores++;

          }


          indice++;

          siguiente();

        }
      )

      .withFailureHandler(
        function(error) {

          console.error(
            "Error:",
            codigo,
            error
          );


          errores++;

          indice++;

          siguiente();

        }
      )

      .registrarAsistencia(
        codigo,
        "CQR Scanner"
      );

  }


  function finalizar() {

    procesando = false;


    document.getElementById(
      "resultado"
    ).innerHTML =

      "✅ <strong>Procesamiento terminado</strong><br><br>" +

      "Total: " +
      total +
      "<br>" +

      "🟢 Registradas: " +
      registrados +
      "<br>" +

      "🟡 Duplicadas: " +
      duplicados +
      "<br>" +

      "🔴 Errores: " +
      errores;


    document.getElementById(
      "btnIniciar"
    ).disabled = false;


    console.log(
      "Procesamiento terminado:",
      {
        total: total,
        registrados: registrados,
        duplicados: duplicados,
        errores: errores
      }
    );

  }


  siguiente();

}
  </script>
<iframe
  id="puenteCQR"
  src="https://script.google.com/macros/s/AKfycbwGZz07PcNVKTETqGtqKJa65XNzKNZXKmQYqVCFv95ZghQ9aiTiXHXYKVyXHn1g8Hv9ZQ/exec?puente=1"
  style="position:absolute; width:1px; height:1px; border:0; opacity:0;"
></iframe>
  <script>

const puente = document.getElementById("puenteCQR");

puente.addEventListener("load", function() {

  console.log("✅ PUENTE CARGADO CORRECTAMENTE");

});

puente.addEventListener("error", function(error) {

  console.error("❌ ERROR AL CARGAR PUENTE:", error);

});

</script>
</body>
</html>
